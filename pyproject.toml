[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resy-sniper"
version = "0.1.0"
description = "Personal Reservation Drop Tracker + Assisted Booker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
assist = ["playwright>=1.48"]
dev = ["pytest>=8.2"]

[project.scripts]
resy_sniper = "resy_sniper.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
